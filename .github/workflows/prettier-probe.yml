name: Prettier Probe

on:
  push:
    paths:
      - '.github/workflows/prettier-probe.yml'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx prettier src/lib/secondary.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-secondary
          path: src/lib/secondary.ts
