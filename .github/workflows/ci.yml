name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: false

      - name: Set up pinned npm
        run: npm install --global npm@11.16.0

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Show canonical formatting
        run: |
          npx prettier --write tests/accessibility/axe.spec.js tests/e2e/article.spec.js tests/e2e/home.spec.js tests/e2e/publishing.spec.js tests/e2e/responsive.spec.js tests/e2e/secondary.spec.js tests/visual/article.spec.js tests/visual/home.spec.js tests/visual/secondary.spec.js
          git diff -- tests/accessibility/axe.spec.js tests/e2e/article.spec.js tests/e2e/home.spec.js tests/e2e/publishing.spec.js tests/e2e/responsive.spec.js tests/e2e/secondary.spec.js tests/visual/article.spec.js tests/visual/home.spec.js tests/visual/secondary.spec.js
          exit 1
