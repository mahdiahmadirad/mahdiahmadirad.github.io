name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: false

      - name: Set up pinned npm
        run: npm install --global npm@11.16.0

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run unit and content tests
        run: npm run test

      - name: Build production output and Pagefind
        run: npm run build

      - name: Validate HTML, links, and budgets
        run: npm run validate:build

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Run behavior and accessibility tests
        run: npx playwright test tests/e2e tests/accessibility

      - name: Run approved-baseline visual tests
        run: npx playwright test --config playwright.visual.config.js
